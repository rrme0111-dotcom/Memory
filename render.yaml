# Render Blueprint：一键部署后端（实现真实用户间共建）
# 用法：在 Render 里 New Blueprint Instance → 连接 GitHub 仓库 → 选此文件
services:
  - type: web
    name: memory-vortex-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
